<!--
  V57 Scientific — ColaberryAI Research Labs Lockup (Dark Mode)

  Full horizontal lockup: mark + wordmark.
  Mark (left): Two outlined kola berries with atom orbital ring
  around the large C-berry and two electron dots.
  Wordmark (right): "laberry" in Inter 600, "AI" in steel blue Inter 800,
  "RESEARCH LABS" in spaced caps below.

  Triple-read: berries = colaberry, brain segments = AI, atom orbit = labs.

  Colors: #FAFAFA white strokes/text, #357895 steel blue AI,
          #A1A1AA muted subtitle, #F87171 coral accent, orbit at 0.4 opacity
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 80" fill="none">

  <!-- ============================================
       MARK — scaled to ~65px height, offset to fit
       Original viewBox 0 0 52 52 → scale ~1.25x
       Translate to vertically center in 80px height
       ============================================ -->
  <g transform="translate(4, 3) scale(1.25)">

    <!-- Orbital ring (behind berry) -->
    <ellipse
      cx="18" cy="26" rx="17" ry="6"
      transform="rotate(-25 18 26)"
      stroke="#FAFAFA" stroke-width="1" stroke-opacity="0.4"
      stroke-linecap="round" fill="none"/>

    <!-- Large C-berry: outer circle -->
    <circle cx="18" cy="26" r="12"
      stroke="#FAFAFA" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Large C-berry: vertical cotyledon division (S-curve) -->
    <path d="M18 14 C16 19.5, 20 32.5, 18 38"
      stroke="#FAFAFA" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Large C-berry: horizontal cotyledon division (S-curve) -->
    <path d="M6 26 C11 24, 25 28, 30 26"
      stroke="#FAFAFA" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Small o-berry: outer circle -->
    <circle cx="38" cy="30" r="7.5"
      stroke="#FAFAFA" stroke-width="2" stroke-linecap="round"/>

    <!-- Curved stem -->
    <path d="M18 14 C20 7, 32 10, 38 22.5"
      stroke="#FAFAFA" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- Leaf at stem midpoint -->
    <ellipse cx="28" cy="11" rx="3.5" ry="1.5"
      transform="rotate(-30 28 11)" fill="#FAFAFA"/>

    <!-- Calyx marks: large berry -->
    <path d="M16 14.5 L16.5 12 M18 14 L18 11.5 M20 14.5 L19.5 12"
      stroke="#FAFAFA" stroke-width="1" stroke-linecap="round"/>

    <!-- Calyx marks: small berry -->
    <path d="M37 23 L37 21 M39 23 L39 21"
      stroke="#FAFAFA" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Electron A: upper-right -->
    <circle cx="32" cy="18" r="2" fill="#357895"/>

    <!-- Electron B: lower-left -->
    <circle cx="4" cy="34" r="2" fill="#357895"/>

    <!-- Coral accent dot -->
    <circle cx="23" cy="21" r="1.8" fill="#F87171"/>

  </g>

  <!-- ============================================
       WORDMARK
       "laberry" completes "Co" from the mark berries
       ============================================ -->

  <!-- "laberry" — Inter SemiBold 600 -->
  <text x="78" y="44"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="600" font-size="38" fill="#FAFAFA"
    letter-spacing="-0.5">laberry</text>

  <!-- "AI" — Inter ExtraBold 800, steel blue -->
  <text x="230" y="44"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="800" font-size="38" fill="#357895"
    letter-spacing="-0.5">AI</text>

  <!-- ============================================
       SUBTITLE: "RESEARCH LABS"
       ============================================ -->
  <text x="79" y="62"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="400" font-size="13" fill="#A1A1AA"
    letter-spacing="3.5">RESEARCH LABS</text>

</svg>
