<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V50: The Crowned Berry — Dark Mode Mark -->

  <!-- 1. C-calyx arc -->
  <path d="M 33 7 C 22 3, 8 8, 4 18 C 0 28, 4 38, 14 44 Q 20 47, 28 44"
        fill="none" stroke="#FAFAFA" stroke-width="3.4" stroke-linecap="round"/>

  <!-- 2. Berry body -->
  <ellipse cx="24" cy="25" rx="13.5" ry="14" fill="none" stroke="#FAFAFA" stroke-width="2.4"/>

  <!-- 3. Vertical kola division -->
  <path d="M 24 11.5 Q 21.5 18, 24 25 Q 26.5 32, 24 38.5"
        fill="none" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 4. Horizontal kola division -->
  <path d="M 11 25 Q 17.5 22.5, 24 25 Q 30.5 27.5, 37 25"
        fill="none" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 5. Calyx crown sepals -->
  <path d="M 19 12.5 Q 20 9, 18 7" fill="none" stroke="#FAFAFA" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 24 11 L 24 7.5" fill="none" stroke="#FAFAFA" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 29 12.5 Q 28 9, 30 7" fill="none" stroke="#FAFAFA" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 6. Stem -->
  <path d="M 24 7.5 L 26 4" fill="none" stroke="#FAFAFA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 7. Leaf -->
  <ellipse cx="28" cy="3.8" rx="3.2" ry="1.3" transform="rotate(20 28 3.8)" fill="#FAFAFA"/>

  <!-- 8. Coral highlight -->
  <circle cx="30" cy="19" r="2.4" fill="#F87171"/>

  <!-- 9. Steel blue AI node -->
  <circle cx="5.5" cy="33" r="1.7" fill="#357895"/>
</svg>
