<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- V28 Mark — "Berry Monogram C" — geometric C cradling 3 berry circles -->

  <!-- The C shape — thick geometric stroke, open on the right -->
  <path d="M28 8 Q12 4 8 20 Q12 36 28 32" stroke="#18181B" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Berry cluster inside the C opening -->
  <!-- Berry 1 — top-right -->
  <circle cx="25" cy="16" r="4.2" fill="#DC2626"/>
  <circle cx="23.6" cy="14.8" r="1.1" fill="#F87171" opacity="0.55"/>

  <!-- Berry 2 — bottom-right -->
  <circle cx="26" cy="24" r="4.2" fill="#DC2626"/>
  <circle cx="24.6" cy="22.8" r="1.1" fill="#F87171" opacity="0.55"/>

  <!-- Berry 3 — center-left, slightly smaller, AI blue -->
  <circle cx="19.5" cy="20.5" r="3.8" fill="#357895"/>
  <circle cx="18.3" cy="19.3" r="1.0" fill="#5BA3C0" opacity="0.5"/>

  <!-- Leaf 1 — peeking from top of berry cluster -->
  <path d="M23 13 Q21 7.5 25 6 Q27 9 24.5 12.5Z" fill="#357895" opacity="0.85"/>
  <path d="M23.5 11.5 Q23.5 8.5 24.5 7" stroke="#2A6073" stroke-width="0.5" fill="none" stroke-linecap="round"/>

  <!-- Leaf 2 — smaller, tucked right -->
  <path d="M27 14 Q30 10.5 32 12.5 Q29.5 14.5 27.5 14.8Z" fill="#357895" opacity="0.65"/>
</svg>