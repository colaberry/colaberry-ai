<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <!-- V25 — "Cola+Berry Ligature"
       The 'y' descender in "Colaberry" curves into a small branch
       with 2 berry dots hanging from it. Organic, embedded in the
       letterform. No standalone mark. -->

  <!-- "Colaberr" — everything before the 'y' -->
  <text x="12" y="48" font-family="Inter, system-ui, sans-serif"
        font-weight="600" font-size="36" fill="#18181B">Colaberr</text>

  <!-- Custom 'y' — we render the base letter then overlay the branch -->
  <text x="195" y="48" font-family="Inter, system-ui, sans-serif"
        font-weight="600" font-size="36" fill="#18181B">y</text>

  <!-- Branch extending from y-descender: curves right then splits -->
  <path d="M207 56 Q212 62, 218 60" stroke="#18181B" stroke-width="1.8"
        fill="none" stroke-linecap="round"/>

  <!-- Tiny leaf at branch junction -->
  <path d="M212 58 Q215 54, 218 55.5" stroke="#357895" stroke-width="1.2"
        fill="none" stroke-linecap="round"/>

  <!-- Berry 1 — hanging from branch tip -->
  <circle cx="220" cy="62.5" r="3" fill="#DC2626"/>
  <!-- Berry 2 — hanging slightly left/lower -->
  <circle cx="214" cy="65" r="2.5" fill="#DC2626"/>

  <!-- "AI" in steel blue -->
  <text x="228" y="48" font-family="Inter, system-ui, sans-serif"
        font-weight="800" font-size="36" fill="#357895">AI</text>

  <!-- "RESEARCH LABS" subtitle -->
  <text x="12" y="68" font-family="Inter, system-ui, sans-serif"
        font-weight="500" font-size="11" letter-spacing="3" fill="#A1A1AA">RESEARCH LABS</text>
</svg>
