<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V32R: The Kola Brain — Refined Mark (Light) -->
  <!-- Thickened internal divisions (2.2px), S-curves preserved, calyx stem nub at top -->

  <!-- Outer circle -->
  <circle cx="24" cy="24" r="19" fill="none" stroke="#18181B" stroke-width="2.5"/>

  <!-- Vertical S-curve division — thickened to 2.2px for favicon legibility -->
  <path d="M 24 5.5 Q 21.5 14, 24 24 Q 26.5 34, 24 42.5" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Horizontal S-curve division — thickened to 2.2px -->
  <path d="M 5.5 24 Q 14 21.5, 24 24 Q 34 26.5, 42.5 24" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Calyx/stem nub at top — tiny botanical hint -->
  <path d="M 24 5 L 23.5 2.5 Q 24 1.5, 25 2.8" fill="none" stroke="#18181B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural spark — coral accent dot -->
  <circle cx="31" cy="15" r="2.5" fill="#DC2626"/>
</svg>
