<svg viewBox="0 0 560 80" xmlns="http://www.w3.org/2000/svg">
  <!-- V40: The Orbital Berry — Light Mode Lockup -->
  <!-- Single berry with one elliptical orbit ring = atom + knowledge + science -->

  <!-- Orbital mark -->
  <g transform="translate(4, 6)">
    <!-- Orbit ring (behind berry) — ellipse rotated 30 degrees -->
    <ellipse cx="24" cy="28" rx="22" ry="11" transform="rotate(-25 24 28)" fill="none" stroke="#A1A1AA" stroke-width="1.3"/>

    <!-- Berry / nucleus -->
    <circle cx="24" cy="28" r="9" fill="#DC2626"/>

    <!-- Stem -->
    <line x1="20" y1="19" x2="18" y2="14" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Micro-leaf -->
    <ellipse cx="19.5" cy="14" rx="3" ry="1.3" transform="rotate(-25 19.5 14)" fill="#18181B"/>

    <!-- Electron dot on orbit path — steel blue for AI/intelligence -->
    <circle cx="44" cy="18" r="2.5" fill="#357895"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="38" fill="#18181B">Colaberry</text>
  <text x="312" y="44" font-family="Inter, sans-serif" font-weight="800" font-size="38" fill="#357895">AI</text>
  <text x="360" y="44" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#52525B" letter-spacing="3">RESEARCH LABS</text>
</svg>
