<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V51: The Berry Branch — Dark Mode Mark -->

  <!-- 1. C-branch -->
  <path d="M 34 6 C 20 2, 5 10, 3 24 C 1 38, 12 46, 26 44"
        fill="none" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round"/>

  <!-- 2. Primary berry -->
  <circle cx="22" cy="26" r="11" fill="none" stroke="#FAFAFA" stroke-width="2.4"/>

  <!-- 3. Secondary berry -->
  <circle cx="34" cy="14" r="6.5" fill="none" stroke="#FAFAFA" stroke-width="2"/>

  <!-- 4. Primary vertical division -->
  <path d="M 22 15.5 Q 20 21, 22 26 Q 24 31, 22 36.5"
        fill="none" stroke="#FAFAFA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 5. Primary horizontal division -->
  <path d="M 11.5 26 Q 17 24, 22 26 Q 27 28, 32.5 26"
        fill="none" stroke="#FAFAFA" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 6. Secondary vertical division -->
  <path d="M 34 8 Q 33 11, 34 14 Q 35 17, 34 20"
        fill="none" stroke="#FAFAFA" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 7. Branch connector -->
  <path d="M 12 11 Q 15 13, 18 15.5"
        fill="none" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round"/>

  <!-- 8. Neural link -->
  <path d="M 29 19 Q 31 22, 32 18"
        fill="none" stroke="#FAFAFA" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="1.5 1.5"/>

  <!-- 9. Leaf -->
  <ellipse cx="8" cy="7.5" rx="3.5" ry="1.5" transform="rotate(-30 8 7.5)" fill="#FAFAFA"/>

  <!-- 10. Coral highlight -->
  <circle cx="27" cy="21" r="2.2" fill="#F87171"/>

  <!-- 11. Steel blue AI node -->
  <circle cx="37" cy="11.5" r="1.6" fill="#357895"/>
</svg>
