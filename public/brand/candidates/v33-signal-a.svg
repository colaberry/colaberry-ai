<svg viewBox="0 0 520 80" xmlns="http://www.w3.org/2000/svg">
  <!-- V33: The Signal A — Light Mode Lockup -->
  <!-- Berry "o" + A's crossbar replaced with sine wave -->

  <!-- "C" -->
  <text x="0" y="48" font-family="Inter, sans-serif" font-weight="600" font-size="42" fill="#18181B">C</text>

  <!-- Berry "o" -->
  <circle cx="52" cy="36" r="11" fill="#DC2626"/>
  <line x1="46" y1="27" x2="43" y2="22" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="45.5" cy="21" rx="3" ry="1.5" transform="rotate(-30 45.5 21)" fill="#18181B"/>

  <!-- "laberry" -->
  <text x="66" y="48" font-family="Inter, sans-serif" font-weight="600" font-size="42" fill="#18181B">laberry</text>

  <!-- "A" with sine wave crossbar — custom path -->
  <g transform="translate(295, 8)">
    <!-- A left stroke -->
    <path d="M 0 40 L 14 0" fill="none" stroke="#357895" stroke-width="3.5" stroke-linecap="round"/>
    <!-- A right stroke -->
    <path d="M 28 40 L 14 0" fill="none" stroke="#357895" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Sine wave crossbar instead of straight line -->
    <path d="M 6 24 Q 10 19, 14 24 Q 18 29, 22 24" fill="none" stroke="#357895" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- "I" -->
  <text x="327" y="48" font-family="Inter, sans-serif" font-weight="800" font-size="42" fill="#357895">I</text>

  <!-- "RESEARCH LABS" -->
  <text x="350" y="48" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="#52525B" letter-spacing="3">RESEARCH LABS</text>
</svg>
