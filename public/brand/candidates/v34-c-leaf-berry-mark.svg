<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V34: The C-Leaf Berry — Favicon Mark -->
  <!-- C-leaf wrapping around berry = the standalone mark -->

  <!-- C-leaf arc -->
  <path d="M 28 6 A 18 18 0 1 0 28 42 Q 20 36, 16 30" fill="none" stroke="#18181B" stroke-width="3" stroke-linecap="round"/>

  <!-- Berry -->
  <circle cx="24" cy="24" r="10" fill="#DC2626"/>

  <!-- Stem -->
  <line x1="20" y1="6" x2="18" y2="1" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>
  <!-- Leaf -->
  <ellipse cx="20.5" cy="2" rx="3.5" ry="1.5" transform="rotate(20 20.5 2)" fill="#18181B"/>
</svg>
