<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V41: The Hybrid — C-Leaf Cradling a Kola Brain (Light) -->
  <!-- "The C cradles a kola nut that looks like a brain. The name literally means knowledge berry." -->
  <!-- 7 SVG elements total. All <path> + <circle>. Enterprise-premium. -->

  <!-- 1. C-leaf arc — protective curve wrapping the segmented berry/brain -->
  <!-- Thick at base (south), tapers toward tip (north-east) via stroke profile -->
  <path d="M 34 8 C 18 4, 2 14, 2 26 C 2 38, 16 46, 34 42" fill="none" stroke="#18181B" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 2. Segmented circle — kola nut cross-section / brain hemispheres -->
  <circle cx="24" cy="25" r="13" fill="none" stroke="#18181B" stroke-width="2.4"/>

  <!-- 3. Vertical S-curve division — organic kola nut cotyledon split -->
  <path d="M 24 12.5 Q 22 19, 24 25 Q 26 31, 24 37.5" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 4. Horizontal S-curve division — creates 4 brain/nut segments -->
  <path d="M 11.5 25 Q 18 23, 24 25 Q 30 27, 36.5 25" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round"/>

  <!-- 5. Micro-stem — connects C-leaf arc to the berry at top -->
  <path d="M 28 8 L 26.5 4" fill="none" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 6. Neural spark — coral accent dot (berry highlight / knowledge node) -->
  <circle cx="30" cy="19" r="2.2" fill="#DC2626"/>

  <!-- 7. AI signal node — steel blue dot on C-leaf arc -->
  <circle cx="5.5" cy="36" r="1.6" fill="#357895"/>
</svg>
