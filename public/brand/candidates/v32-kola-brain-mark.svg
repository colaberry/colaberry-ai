<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V32: The Kola Brain — Standalone Mark (Light) -->
  <!-- Circle with internal segments: reads as kola nut cross-section / brain hemispheres -->

  <!-- Outer circle -->
  <circle cx="24" cy="24" r="19" fill="none" stroke="#18181B" stroke-width="2.5"/>

  <!-- Vertical division — slightly S-curved for organic feel -->
  <path d="M 24 7 Q 22 16, 24 24 Q 26 32, 24 41" fill="none" stroke="#18181B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Horizontal division — gentle curve creating 4 cotyledon segments -->
  <path d="M 7 24 Q 16 22, 24 24 Q 32 26, 41 24" fill="none" stroke="#18181B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Highlight dot — berry shine / neural spark -->
  <circle cx="31" cy="15" r="2.5" fill="#DC2626"/>
</svg>
