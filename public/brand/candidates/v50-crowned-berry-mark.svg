<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V50: The Crowned Berry — C-calyx wrapping a botanical kola berry (Light) -->
  <!-- "The C IS the calyx. The berry IS the o. Together they read as Co." -->
  <!-- Discovery: 0s="premium tech mark" → 5s="that's a berry with a leaf" → 10s="the segments look like brain hemispheres" -->
  <!-- 9 SVG elements. All <path>/<circle>/<ellipse>. Enterprise-luxury. -->

  <!-- 1. C-calyx arc — thick protective curve wrapping the berry from NW to SW -->
  <!-- This IS the letter C and the botanical calyx simultaneously -->
  <path d="M 33 7 C 22 3, 8 8, 4 18 C 0 28, 4 38, 14 44 Q 20 47, 28 44"
        fill="none" stroke="#18181B" stroke-width="3.4" stroke-linecap="round"/>

  <!-- 2. Berry body — slightly oval, positioned as the "o" in Co -->
  <!-- Larger than V41's circle, reads as a real fruit -->
  <ellipse cx="24" cy="25" rx="13.5" ry="14" fill="none" stroke="#18181B" stroke-width="2.4"/>

  <!-- 3. Kola nut vertical division — S-curve cotyledon split (brain hemisphere clue) -->
  <path d="M 24 11.5 Q 21.5 18, 24 25 Q 26.5 32, 24 38.5"
        fill="none" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 4. Kola nut horizontal division — creates 4 lobes (brain quadrants) -->
  <path d="M 11 25 Q 17.5 22.5, 24 25 Q 30.5 27.5, 37 25"
        fill="none" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 5. Calyx crown — 3 small sepals at top of berry (botanical authenticity) -->
  <!-- These distinguish "berry" from "bomb" — real fruit detail -->
  <path d="M 19 12.5 Q 20 9, 18 7" fill="none" stroke="#18181B" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 24 11 L 24 7.5" fill="none" stroke="#18181B" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 29 12.5 Q 28 9, 30 7" fill="none" stroke="#18181B" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 6. Stem — short, connects berry to branch above -->
  <path d="M 24 7.5 L 26 4" fill="none" stroke="#18181B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 7. Small leaf at stem — organic, tilted -->
  <ellipse cx="28" cy="3.8" rx="3.2" ry="1.3" transform="rotate(20 28 3.8)" fill="#18181B"/>

  <!-- 8. Coral highlight — berry sheen / knowledge spark (upper-right quadrant) -->
  <circle cx="30" cy="19" r="2.4" fill="#DC2626"/>

  <!-- 9. Steel blue AI node — on the C-calyx arc (intelligence signal) -->
  <circle cx="5.5" cy="33" r="1.7" fill="#357895"/>
</svg>
