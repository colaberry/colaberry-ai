<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V37: The Bracket Mark — Standalone Mark (Light) -->
  <!-- Square brackets containing a berry-node: [berry] = contained knowledge -->

  <!-- Left bracket -->
  <path d="M 10 6 L 4 6 L 4 42 L 10 42" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right bracket -->
  <path d="M 38 6 L 44 6 L 44 42 L 38 42" fill="none" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Berry -->
  <circle cx="24" cy="25" r="8" fill="#DC2626"/>

  <!-- Stem -->
  <line x1="22" y1="17" x2="20" y2="12" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Micro-leaf -->
  <ellipse cx="21.5" cy="12" rx="3" ry="1.3" transform="rotate(-20 21.5 12)" fill="#18181B"/>
</svg>
