<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <!-- V21 — "Triple Berry Cluster" -->
  <!-- The 'o' in Colaberry is replaced by a 3-circle berry cluster -->

  <!-- "C" -->
  <text x="12" y="48" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="36" fill="#18181B">C</text>

  <!-- Berry cluster replacing 'o' — 3 circles in triangular arrangement -->
  <!-- Bottom-left berry -->
  <circle cx="39" cy="40" r="5.5" fill="#DC2626"/>
  <!-- Bottom-right berry -->
  <circle cx="49" cy="40" r="5.5" fill="#DC2626"/>
  <!-- Top berry (slightly darker for depth) -->
  <circle cx="44" cy="31" r="5.5" fill="#B91C1C"/>
  <!-- Tiny leaf pair at top -->
  <path d="M44 25.5 Q48 22 51 24" stroke="#357895" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M44 25.5 Q40 22 37 24" stroke="#357895" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Tiny stem -->
  <line x1="44" y1="25.5" x2="44" y2="27" stroke="#357895" stroke-width="1.2" stroke-linecap="round"/>

  <!-- "laberry" -->
  <text x="55" y="48" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="36" fill="#18181B">laberry</text>

  <!-- "AI" in steel blue -->
  <text x="225" y="48" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="36" fill="#357895">AI</text>

  <!-- "RESEARCH LABS" subtitle -->
  <text x="12" y="68" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="11" letter-spacing="3" fill="#A1A1AA">RESEARCH LABS</text>
</svg>