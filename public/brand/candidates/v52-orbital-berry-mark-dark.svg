<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- V52: The Orbital Berry — Dark Mode Mark -->

  <!-- 1. C-leaf arc -->
  <path d="M 32 6 C 18 2, 3 12, 3 24 C 3 36, 14 46, 30 43"
        fill="none" stroke="#FAFAFA" stroke-width="3.2" stroke-linecap="round"/>

  <!-- 2. Berry body -->
  <circle cx="23" cy="24" r="12" fill="none" stroke="#FAFAFA" stroke-width="2.4"/>

  <!-- 3. Vertical division -->
  <path d="M 23 12.5 Q 21 18, 23 24 Q 25 30, 23 35.5"
        fill="none" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 4. Horizontal division -->
  <path d="M 11.5 24 Q 17 22, 23 24 Q 29 26, 34.5 24"
        fill="none" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 5. Orbital ring -->
  <ellipse cx="23" cy="24" rx="18" ry="7" transform="rotate(-30 23 24)"
           fill="none" stroke="#FAFAFA" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- 6. Electron dot A -->
  <circle cx="38" cy="13" r="2" fill="#357895"/>

  <!-- 7. Electron dot B -->
  <circle cx="8" cy="35" r="2" fill="#357895"/>

  <!-- 8. Stem -->
  <path d="M 23 12 L 25.5 7" fill="none" stroke="#FAFAFA" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 9. Leaf -->
  <ellipse cx="27.5" cy="6.5" rx="3" ry="1.2" transform="rotate(20 27.5 6.5)" fill="#FAFAFA"/>

  <!-- 10. Coral highlight -->
  <circle cx="28.5" cy="19" r="2.2" fill="#F87171"/>
</svg>
