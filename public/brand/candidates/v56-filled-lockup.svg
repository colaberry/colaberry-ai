<!-- V56 Filled Lockup — ColaberryAI Research Labs -->
<!-- Full horizontal lockup: two-berry mark + wordmark -->
<!-- Light mode variant -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 80" fill="none">

  <!-- ============================================= -->
  <!-- MARK: Two kola nut berries (C + o) at left    -->
  <!-- Scaled to ~60px height, offset for padding    -->
  <!-- ============================================= -->
  <g transform="translate(8, 8) scale(1.3)">

    <!-- Curved stem connecting both berries -->
    <path
      d="M16 11 C20 6, 30 6, 36 20"
      stroke="#18181B" stroke-width="1.8" stroke-linecap="round" fill="none"
    />

    <!-- Leaf at stem junction -->
    <ellipse
      cx="24" cy="9" rx="4.5" ry="2"
      transform="rotate(-30 24 9)"
      fill="#18181B"
    />
    <!-- Leaf vein -->
    <path
      d="M22 9.5 Q24 8.5, 26.5 8"
      stroke="#FFFFFF" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.4"
    />

    <!-- Steel blue AI dot on stem -->
    <circle cx="26" cy="12" r="1.5" fill="#357895" />

    <!-- Large berry (C) — solid coral -->
    <circle cx="16" cy="24" r="13" fill="#DC2626" />

    <!-- Calyx at top of large berry -->
    <path
      d="M14 11.5 L16 13 L18 11.5"
      stroke="#18181B" stroke-width="1" stroke-linecap="round" fill="none"
    />

    <!-- Internal segment lines — large berry -->
    <path
      d="M16 11.5 C13 18, 19 30, 16 36.5"
      stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none"
    />
    <path
      d="M3.5 24 C10 21, 22 27, 28.5 24"
      stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none"
    />

    <!-- Small berry (o) — solid coral -->
    <circle cx="36" cy="28" r="8" fill="#DC2626" />

    <!-- Calyx at top of small berry -->
    <path
      d="M34.5 20.5 L36 22 L37.5 20.5"
      stroke="#18181B" stroke-width="0.8" stroke-linecap="round" fill="none"
    />

    <!-- Internal segment lines — small berry -->
    <path
      d="M36 20.5 C34 24, 38 32, 36 35.5"
      stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none"
    />
    <path
      d="M28.5 28 C32 26, 40 30, 43.5 28"
      stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none"
    />

  </g>

  <!-- ============================================= -->
  <!-- WORDMARK: "laberry" + "AI"                    -->
  <!-- The berries replace C and o, text continues   -->
  <!-- ============================================= -->

  <!-- "laberry" — continues the word after the berry mark -->
  <text
    x="95" y="52"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="38"
    font-weight="600"
    fill="#18181B"
    letter-spacing="-0.5"
  >laberry</text>

  <!-- "AI" — steel blue accent -->
  <text
    x="270" y="52"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="38"
    font-weight="800"
    fill="#357895"
    letter-spacing="0"
  >AI</text>

  <!-- "RESEARCH LABS" — muted subtitle -->
  <text
    x="95" y="70"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="400"
    fill="#52525B"
    letter-spacing="3.5"
  >RESEARCH LABS</text>

</svg>
