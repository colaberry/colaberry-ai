<svg viewBox="0 0 560 80" xmlns="http://www.w3.org/2000/svg">
  <!-- V35: The Berry Constellation — Light Mode Lockup -->
  <!-- 3 dots in triangular arrangement with berry character, connected by thin lines -->

  <!-- Constellation mark -->
  <g transform="translate(4, 10)">
    <!-- Connection lines (graph edges / branches) -->
    <line x1="10" y1="12" x2="36" y2="8" stroke="#A1A1AA" stroke-width="1"/>
    <line x1="36" y1="8" x2="22" y2="42" stroke="#A1A1AA" stroke-width="1"/>
    <line x1="10" y1="12" x2="22" y2="42" stroke="#A1A1AA" stroke-width="1"/>

    <!-- Berry-dot A (top-left): slightly organic — not a perfect circle -->
    <ellipse cx="10" cy="12" rx="5.5" ry="5" fill="#18181B"/>
    <!-- Tiny calyx hint on top -->
    <line x1="9" y1="6.5" x2="8" y2="4" stroke="#18181B" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Berry-dot B (top-right): smaller -->
    <circle cx="36" cy="8" r="4" fill="#18181B"/>

    <!-- Berry-dot C (bottom-center): largest, primary, coral accent -->
    <ellipse cx="22" cy="42" rx="6.5" ry="6" fill="#DC2626"/>
    <!-- Subtle highlight on primary berry -->
    <circle cx="19" cy="39" r="1.5" fill="#EF4444" opacity="0.6"/>
  </g>

  <!-- Wordmark -->
  <text x="58" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="38" fill="#18181B">Colaberry</text>
  <text x="310" y="44" font-family="Inter, sans-serif" font-weight="800" font-size="38" fill="#357895">AI</text>

  <!-- Subtitle -->
  <text x="358" y="44" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#52525B" letter-spacing="3">RESEARCH LABS</text>
</svg>
