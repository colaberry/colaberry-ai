<svg viewBox="0 0 560 80" xmlns="http://www.w3.org/2000/svg">
  <!-- V38: The Growth Branch — Light Mode Lockup -->
  <!-- Minimalist branch with 2-3 berries = knowledge growing -->

  <!-- Branch mark -->
  <g transform="translate(4, 8)">
    <!-- Main branch curve — bottom-left to upper-right -->
    <path d="M 4 52 Q 12 40, 18 30 Q 22 22, 28 16" fill="none" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Fork 1: branches left -->
    <path d="M 18 30 Q 14 26, 8 22" fill="none" stroke="#18181B" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Fork 2: branches right from higher up -->
    <path d="M 24 22 Q 30 18, 36 16" fill="none" stroke="#18181B" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Berry A: end of main branch (largest) -->
    <circle cx="28" cy="12" r="6" fill="#DC2626"/>

    <!-- Berry B: end of fork 1 -->
    <circle cx="6" cy="20" r="4.5" fill="#18181B"/>

    <!-- Berry C: end of fork 2 -->
    <circle cx="38" cy="14" r="3.5" fill="#18181B"/>

    <!-- Leaf at first fork point -->
    <ellipse cx="16" cy="28" rx="4" ry="1.8" transform="rotate(-50 16 28)" fill="#18181B"/>
  </g>

  <!-- Wordmark -->
  <text x="56" y="46" font-family="Inter, sans-serif" font-weight="600" font-size="38" fill="#18181B">Colaberry</text>
  <text x="308" y="46" font-family="Inter, sans-serif" font-weight="800" font-size="38" fill="#357895">AI</text>
  <text x="356" y="46" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#52525B" letter-spacing="3">RESEARCH LABS</text>
</svg>
