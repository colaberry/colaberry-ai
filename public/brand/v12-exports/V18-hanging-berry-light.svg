<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 76" width="350" height="76">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <!-- V18 Hanging Berry (Light) — Baseline Disruption + Scale Variation -->
  <!-- "o" drops below baseline like hanging berry; C = branch; AI = larger scale -->
  <text x="0" y="48" font-size="48" font-weight="600" fill="#18181B" letter-spacing="-0.03em">C</text>
  <!-- Branch stem from C to hanging berry -->
  <line x1="28" y1="34" x2="40" y2="40" stroke="#18181B" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <!-- Hanging berry "o" — dropped below baseline -->
  <circle cx="44" cy="42" r="10.5" fill="#357895"/>
  <!-- Tiny stem on top of berry -->
  <line x1="44" y1="31.5" x2="44" y2="28" stroke="#18181B" stroke-width="1.6" stroke-linecap="round"/>
  <text x="58" y="48" font-size="48" font-weight="600" fill="#18181B" letter-spacing="-0.03em">laberry</text>
  <!-- AI slightly larger — scale variation emphasis -->
  <text x="198" y="48" font-size="52" font-weight="800" fill="#357895" letter-spacing="-0.03em">AI</text>
  <!-- Research · Labs -->
  <text x="0" y="70" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">RESEARCH</text>
  <circle cx="82" cy="66" r="3" fill="#357895" opacity="0.6"/>
  <text x="90" y="70" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">LABS</text>
</svg>
