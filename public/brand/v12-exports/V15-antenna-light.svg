  <!-- Broadcast arcs -->
  <path d="M235,6 A6,6 0 0,1 245,6" stroke="#357895" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M231,2 A10,10 0 0,1 249,2" stroke="#357895" stroke-width="1.2" fill="none" opacity="0.3"/>
  <!-- Research · Labs -->
  <text x="0" y="66" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">RESEARCH</text>
