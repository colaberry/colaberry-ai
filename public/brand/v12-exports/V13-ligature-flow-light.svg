<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 72" width="350" height="72">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <!-- V13 Ligature Flow (Light) — A's right leg flows into I's stem -->
  <text x="0" y="48" font-size="48" font-weight="600" fill="#18181B" letter-spacing="-0.03em">C</text>
  <circle cx="44" cy="37" r="10.5" fill="#357895"/>
  <line x1="44" y1="26.5" x2="44" y2="22" stroke="#18181B" stroke-width="1.6" stroke-linecap="round"/>
  <text x="58" y="48" font-size="48" font-weight="600" fill="#18181B" letter-spacing="-0.03em">laberry</text>
  <!-- AI Ligature: A shape + flowing connection to I -->
  <path d="M200,48 L216,10 L232,48" stroke="#357895" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="207" y1="34" x2="225" y2="34" stroke="#357895" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Flowing connection: A right leg curves into I stem -->
  <path d="M232,48 Q236,48 238,10" stroke="#357895" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- I tittle as berry node -->
  <circle cx="238" cy="5" r="4" fill="#357895"/>
  <!-- Research · Labs -->
  <text x="0" y="66" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">RESEARCH</text>
  <circle cx="82" cy="62" r="3" fill="#357895" opacity="0.6"/>
  <text x="90" y="66" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">LABS</text>
</svg>
