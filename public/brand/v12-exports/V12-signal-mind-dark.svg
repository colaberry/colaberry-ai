<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 72" width="350" height="72">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <rect width="350" height="72" fill="#09090B"/>
  <!-- V12 Signal Mind (Dark) — Crossbar Sub + Counter Shape + Tittle Replace -->
  <text x="0" y="48" font-size="48" font-weight="600" fill="#FAFAFA" letter-spacing="-0.03em">C</text>
  <circle cx="44" cy="37" r="10.5" fill="#4A9BBF"/>
  <line x1="44" y1="26.5" x2="44" y2="22" stroke="#FAFAFA" stroke-width="1.6" stroke-linecap="round"/>
  <text x="58" y="48" font-size="48" font-weight="600" fill="#FAFAFA" letter-spacing="-0.03em">laberry</text>
  <!-- A with EEG crossbar wave -->
  <text x="198" y="48" font-size="48" font-weight="800" fill="#4A9BBF" letter-spacing="-0.03em">A</text>
  <path d="M204 30 Q210 26 216 30 Q222 34 228 30" stroke="#4A9BBF" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.75"/>
  <!-- Eye in A's counter -->
  <ellipse cx="216" cy="24" rx="4" ry="2.5" stroke="#4A9BBF" stroke-width="1" fill="none" opacity="0.25"/>
  <circle cx="216" cy="24" r="1.2" fill="#4A9BBF" opacity="0.3"/>
  <!-- I with neural pulse tittle -->
  <text x="228" y="48" font-size="48" font-weight="800" fill="#4A9BBF" letter-spacing="-0.03em">I</text>
  <circle cx="240" cy="5" r="4" fill="#4A9BBF"/>
  <circle cx="240" cy="5" r="6.5" stroke="#4A9BBF" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Research · Labs -->
  <text x="0" y="66" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">RESEARCH</text>
  <circle cx="82" cy="62" r="3" fill="#4A9BBF" opacity="0.5"/>
  <circle cx="82" cy="62" r="2" stroke="#FAFAFA" stroke-width="0.6" fill="none" opacity="0.2"/>
  <text x="90" y="66" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">LABS</text>
</svg>
