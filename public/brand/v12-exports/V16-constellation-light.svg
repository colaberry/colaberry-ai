<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 72" width="350" height="72">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap');
    text { font-family: 'Inter', system-ui, sans-serif; }
  </style>
  <!-- V16 Constellation (Light) — Negative Space + Color Isolation -->
  <!-- 3 nodes (berry-o, I-dot, Labs-dot) connected by hair-thin lines = knowledge graph -->
  <text x="0" y="48" font-size="48" font-weight="600" fill="#18181B" letter-spacing="-0.03em">C</text>
  <!-- Berry "o" — node 1 -->
  <circle cx="44" cy="37" r="10.5" fill="#357895"/>
  <line x1="44" y1="26.5" x2="44" y2="22" stroke="#18181B" stroke-width="1.6" stroke-linecap="round"/>
  <text x="58" y="48" font-size="48" font-weight="600" fill="#18181B" letter-spacing="-0.03em">laberry</text>
  <text x="198" y="48" font-size="48" font-weight="800" fill="#357895" letter-spacing="-0.03em">A</text>
  <!-- I with accent node — node 2 -->
  <text x="228" y="48" font-size="48" font-weight="800" fill="#357895" letter-spacing="-0.03em">I</text>
  <circle cx="240" cy="5" r="5" fill="#357895"/>
  <!-- Constellation lines: berry-o → I-dot → Labs-dot → berry-o (triangle) -->
  <line x1="44" y1="37" x2="240" y2="5" stroke="#18181B" stroke-width="1.2" opacity="0.12"/>
  <line x1="240" y1="5" x2="82" y2="62" stroke="#18181B" stroke-width="1" opacity="0.12"/>
  <line x1="82" y1="62" x2="44" y2="37" stroke="#18181B" stroke-width="1" opacity="0.12"/>
  <!-- Research · Labs -->
  <text x="0" y="66" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">RESEARCH</text>
  <!-- Node 3 — completes constellation triangle -->
  <circle cx="82" cy="62" r="3.5" fill="#357895" opacity="0.7"/>
  <text x="90" y="66" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.2em">LABS</text>
</svg>
