<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <!-- Mark 4 / V20: "Neural Grid" — MIT-style grid mark
       Abstract "AI" in geometric blocks. A = triangle form from blocks,
       I = single column with berry-dot tittle. Knowledge graph lines connect.
       Inspired by MIT Media Lab's bold modular identity system.
       Clue: A + I = AI letterforms, berry dot = Colaberry, grid = research -->
  <!-- A letterform: left leg -->
  <rect x="4" y="14" width="8" height="38" fill="#18181B"/>
  <!-- A letterform: right leg -->
  <rect x="20" y="14" width="8" height="38" fill="#18181B"/>
  <!-- A letterform: crossbar -->
  <rect x="4" y="30" width="24" height="7" fill="#357895"/>
  <!-- A letterform: apex cap -->
  <rect x="8" y="6" width="16" height="8" fill="#18181B"/>
  <!-- I letterform: stem -->
  <rect x="38" y="14" width="8" height="38" fill="#18181B"/>
  <!-- I letterform: berry-dot tittle -->
  <circle cx="42" cy="6" r="5" fill="#357895"/>
  <!-- Knowledge graph connecting lines (subtle) -->
  <line x1="16" y1="6" x2="42" y2="6" stroke="#357895" stroke-width="1" opacity="0.2"/>
  <line x1="42" y1="6" x2="42" y2="14" stroke="#357895" stroke-width="1" opacity="0.15"/>
  <!-- Grid dots at corners (MIT-style modular grid reference) -->
  <circle cx="54" cy="2" r="1.5" fill="#18181B" opacity="0.15"/>
  <circle cx="54" cy="54" r="1.5" fill="#18181B" opacity="0.15"/>
  <circle cx="2" cy="54" r="1.5" fill="#18181B" opacity="0.15"/>
</svg>
