<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  <!-- Branding -->
  <text x="60" y="56" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500">Colaberry.ai</text>
  <!-- Connected nodes icon -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <!-- Central hub and spokes -->
    <line x1="40" y1="40" x2="18" y2="20" stroke="#3F3F46" stroke-width="2"/>
    <line x1="40" y1="40" x2="62" y2="20" stroke="#3F3F46" stroke-width="2"/>
    <line x1="40" y1="40" x2="18" y2="60" stroke="#3F3F46" stroke-width="2"/>
    <line x1="40" y1="40" x2="62" y2="60" stroke="#3F3F46" stroke-width="2"/>
    <line x1="18" y1="20" x2="62" y2="20" stroke="#3F3F46" stroke-width="1.5"/>
    <line x1="18" y1="60" x2="62" y2="60" stroke="#3F3F46" stroke-width="1.5"/>
    <!-- Nodes -->
    <circle cx="40" cy="40" r="7" fill="#DC2626"/>
    <circle cx="18" cy="20" r="5" fill="#A1A1AA"/>
    <circle cx="62" cy="20" r="5" fill="#A1A1AA"/>
    <circle cx="18" cy="60" r="5" fill="#71717A"/>
    <circle cx="62" cy="60" r="5" fill="#71717A"/>
  </g>
  <!-- Coral accent line -->
  <rect x="60" y="290" width="80" height="4" rx="2" fill="#DC2626"/>
  <!-- Title -->
  <text x="60" y="350" fill="#FAFAFA" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Ecosystem Graph</text>
  <!-- Subtitle -->
  <text x="60" y="405" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400">Cross-type relationships visualized</text>
  <!-- Bottom border accent -->
  <rect x="0" y="622" width="1200" height="8" fill="#DC2626"/>
</svg>