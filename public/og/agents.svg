<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  <!-- Branding -->
  <text x="60" y="56" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500">Colaberry.ai</text>
  <!-- Robot/Agent icon -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <rect x="20" y="16" width="14" height="14" rx="4" fill="#DC2626"/>
    <rect x="46" y="16" width="14" height="14" rx="4" fill="#DC2626"/>
    <rect x="16" y="44" width="48" height="8" rx="4" fill="#3F3F46"/>
    <rect x="30" y="60" width="20" height="6" rx="3" fill="#3F3F46"/>
    <!-- Antenna -->
    <line x1="40" y1="0" x2="40" y2="-16" stroke="#3F3F46" stroke-width="2"/>
    <circle cx="40" cy="-20" r="4" fill="#DC2626"/>
  </g>
  <!-- Coral accent line -->
  <rect x="60" y="300" width="80" height="4" rx="2" fill="#DC2626"/>
  <!-- Title -->
  <text x="60" y="360" fill="#FAFAFA" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">AI Agents</text>
  <!-- Subtitle -->
  <text x="60" y="415" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400">29 enterprise agents across 13 industries</text>
  <!-- Bottom border accent -->
  <rect x="0" y="622" width="1200" height="8" fill="#DC2626"/>
</svg>