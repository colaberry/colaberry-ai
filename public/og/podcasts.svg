<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#09090B"/>
  <!-- Branding -->
  <text x="60" y="56" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500">Colaberry.ai</text>
  <!-- Microphone icon -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <!-- Mic body -->
    <rect x="30" y="14" width="20" height="32" rx="10" fill="#DC2626"/>
    <!-- Mic stand arc -->
    <path d="M24 38c0 12 8 20 16 20s16-8 16-20" stroke="#3F3F46" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Mic stand -->
    <line x1="40" y1="58" x2="40" y2="68" stroke="#3F3F46" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="68" x2="48" y2="68" stroke="#3F3F46" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Coral accent line -->
  <rect x="60" y="290" width="80" height="4" rx="2" fill="#DC2626"/>
  <!-- Title -->
  <text x="60" y="350" fill="#FAFAFA" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">AI Podcasts</text>
  <!-- Subtitle -->
  <text x="60" y="405" fill="#A1A1AA" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400">260+ episodes with full transcripts</text>
  <!-- Bottom border accent -->
  <rect x="0" y="622" width="1200" height="8" fill="#DC2626"/>
</svg>