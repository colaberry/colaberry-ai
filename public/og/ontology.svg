    <rect x="0" y="0" width="80" height="80" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <!-- Nodes and edges -->
    <line x1="24" y1="24" x2="56" y2="24" stroke="#3F3F46" stroke-width="2"/>
    <line x1="24" y1="24" x2="40" y2="56" stroke="#3F3F46" stroke-width="2"/>
    <line x1="56" y1="24" x2="40" y2="56" stroke="#3F3F46" stroke-width="2"/>
    <line x1="56" y1="24" x2="64" y2="52" stroke="#3F3F46" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#DC2626"/>
    <circle cx="56" cy="24" r="6" fill="#A1A1AA"/>
    <circle cx="40" cy="56" r="6" fill="#A1A1AA"/>
    <circle cx="64" cy="52" r="5" fill="#71717A"/>
